<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Chourasia Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="nav-shell container">
        <a href="index.html" class="logo">Chourasia <span>Commerce</span></a>
        <div class="nav-actions">
          <a href="login.html">Login</a>
          <a href="orders.html">Orders</a>
          <a href="index.html">Shop</a>
        </div>
      </nav>
    </header>

    <main class="section container auth-shell">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p>Register to save your cart and view order history.</p>
        <form id="register-form">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="6" />
          <button type="submit" class="btn btn-primary">Register</button>
          <p class="form-message" id="register-message"></p>
        </form>
        <p class="form-note">Already have an account? <a href="login.html">Login here</a>.</p>
      </div>
    </main>

    <script src="register.js"></script>
  </body>
</html>
